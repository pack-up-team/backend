spring:
  application:
    name: PackUp-Backend
  profiles:
    active: local

  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp
  security:
    user:
      name: admin
      password: 1234
  

  datasource:
    url: jdbc:log4jdbc:mysql://pack-up-db.cr8ym8i88z94.ap-northeast-2.rds.amazonaws.com:3306/pack-up-db?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: admin
    password: packUp123
    driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
    hikari:
      maximum-pool-size: 300
      minimum-idle: 10
      idle-timeout: 600000
      max-lifetime: 1800000
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect
  data:
   redis:
    host: localhost
    port: 6379

  mail:
    host: smtp.gmail.com
    port: 587
    username: ##################
    password: ##################
    properties:
      mail:
       smtp:
        auth: true
        starttls:
         enable: true
         required: true
      debug: true

file:
  upload:
    path: C:/temp/uploads/
    max-size: 52428800
    max-request-size: 104857600
    allowed-extensions: jpg,jpeg,png,gif,pdf,doc,docx,xls,xlsx,txt

server:
  port: 8080
  tomcat:
   max-part-count: -1

app:
  base-url: ${BASE_URL:http://localhost:8080}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

logging:
  level:
    org.springframework: DEBUG
    com.backend: DEBUG
    org.hibernate: DEBUG

mybatis:
  config-location: classpath:mybatis-config.xml
  mapper-locations: 
    - classpath:mapper/file/**/*.xml
    - classpath:mapper/lgn/**/*.xml  
    - classpath:mapper/notification/**/*.xml
    - classpath:mapper/register/**/*.xml
    - classpath:mapper/template/**/*.xml
    # calendar 폴더는 삭제됨 - DB 없이 REST API로만 동작

slack:
  client-id: slack_client_id
  client-secret: slack_client_secret

google:
  calendar:
    client-id: ${GOOGLE_CALENDAR_CLIENT_ID:google_calendar_client_id}
    client-secret: ${GOOGLE_CALENDAR_CLIENT_SECRET:google_calendar_client_secret}
    redirect-uri: ${GOOGLE_CALENDAR_REDIRECT_URI:https://api.packup.swygbro.com/calendar/callback}